<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
  <header th:replace="~{fragments/header ::header}"></header>

  <main class="container">
    <section id="welcome">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1 style="margin:0;">Welcome, <span th:text="${userData != null ? userData.name : 'User'}">User</span></h1>
        <span class="badge role" th:text="${roleBadge != null ? roleBadge : 'No role'}">Role</span>
      </div>
    </section>

    <div th:if="${showPasswordExpiryReminder}">
      <button id="open-password-expiry-reminder" type="button" hidden data-target="modal-password-expiry-reminder"
        onclick="toggleModal(event)">Open password expiry reminder</button>
      <div
        th:replace="~{fragments/password-expiry-reminder-modal :: passwordExpiryReminderModal(showPasswordExpiryReminder=${showPasswordExpiryReminder})}">
      </div>
    </div>

    <section id="projects" th:if="${sectionVisibility.projectsVisible}">
      <hr>
      <details open="">
        <summary><a href="/projects" class="project-link">Projects</a></summary>
        <div>
          <a th:href="@{/create-project}" role="button">
            Create Project
          </a>
        </div>
        <div class="project-grid">
          <th:block th:each="project : ${projects}">
            <article th:replace="~{fragments/project-card :: projectCard(project=${project})}"></article>
          </th:block>
        </div>
      </details>
    </section>

    <section id="advisors" th:if="${sectionVisibility.advisorsVisible}">
      <hr>
      <details open="">
        <summary>Advisor Invitations</summary>
        <div th:if="${rights.isAdvisor()}">
          <div class="card">
            <div th:if="${advisorInvitations != null and #lists.isEmpty(advisorInvitations) == false}">
              <th:block th:each="inv : ${advisorInvitations}">
                <article th:replace="~{fragments/advisor-invitation-card :: advisorInvitation(invitation=${inv})}">
                </article>
              </th:block>
            </div>
            <div th:if="${advisorInvitations == null or #lists.isEmpty(advisorInvitations)}">
              <p>No invitations</p>
            </div>
          </div>
        </div>
        <div th:if="${!rights.isAdvisor()}">
          <span th:text="${advisorsMessage}">Advisors Section (not done)</span>
        </div>
      </details>
    </section>

    <section id="student-invitations" th:if="${rights != null && rights.isStudent()}">
      <hr>
      <details open="">
        <summary>Student Invitations</summary>
        <div class="card">
          <div th:if="${studentInvitations != null and #lists.isEmpty(studentInvitations) == false}">
            <th:block th:each="inv : ${studentInvitations}">
              <article th:replace="~{fragments/student-invitation-card :: studentInvitation(invitation=${inv})}">
              </article>
            </th:block>
          </div>
          <div th:if="${studentInvitations == null or #lists.isEmpty(studentInvitations)}">
            <p>No invitations</p>
          </div>
        </div>
      </details>
    </section>

    <section id="student-progress" th:if="${studentProgress != null}">
      <hr>
      <details open="">
        <summary>Student Progress</summary>
        <div th:replace="~{fragments/student-progress-card :: studentProgressCard(studentProgress=${studentProgress})}">
        </div>
      </details>
    </section>

    <section id="password-last-changed">
      <hr>
      <details open="">
        <summary>Password status</summary>
        <div
          th:replace="~{fragments/password-last-changed :: passwordLastChanged(passwordChangedAt=${passwordChangedAt}, passwordExpiresAt=${passwordExpiresAt})}">
        </div>
      </details>
    </section>
  </main>

  <footer th:replace="~{fragments/footer ::footer}"></footer>
  <script th:src="@{/js/password-expiry-reminder.js}" defer></script>
</body>

</html>
