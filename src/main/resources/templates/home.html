<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
  <header th:replace="~{fragments/header ::header}"></header>

  <main class="container">
    <section id="welcome">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h1 style="margin:0;">Welcome, <span th:text="${userData != null ? userData.name : 'User'}">User</span></h1>
        <span class="badge role" th:text="${roleBadge != null ? roleBadge : 'No role'}">Role</span>
      </div>
    </section>

    <hr>

    <section id="projects" th:if="${sectionVisibility.projectsVisible}">
      <details open="">
        <summary>Projects</summary>
        <div>
          <a th:href="@{/create-project}" role="button">
            Create Project
          </a>
        </div>
        <div class="grid">
          <th:block th:each="project : ${projects}">
            <article th:replace="~{fragments/project-card :: projectCard(project=${project})}"></article>
          </th:block>
        </div>
      </details>

    </section>

    <hr>

    <section id="invitations" th:if="${sectionVisibility.invitationsVisible}">
      <details open="">
        <summary>Invitations</summary>
        <th:block th:each="invitation : ${invitations}">
          <article th:replace="~{fragments/invitation-card :: invitationCard(invitation=${invitation})}"></article>
        </th:block>
      </details>
    </section>

    <hr>

    <section id="advisors" th:if="${sectionVisibility.advisorsVisible}">
      <details open="">
        <summary>Advisors</summary>
        <span th:text="${advisorsMessage}">Advisors Section (not done)</span>
      </details>
    </section>
  </main>

  <footer th:replace="~{fragments/footer ::footer}"></footer>
</body>

</html>
