<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/head ::head}"></head>
<body>
<header th:replace="~{fragments/header ::header}"></header>
<main class="container">
<article>
    <div>
        <header>
        <h3>Current advisor workload</h3>
        </header>
        <p>Current active/working projects: <span th:text="${projectCount}">0</span> out of <span th:text="${maxProjectCount}"></span></p>
        <footer>
        <progress th:value="${projectCount}" th:max="${maxProjectCount}" />
        </footer>
        <section id="modal">
            <button class="button" data-target="modal-example" onclick="toggleModal(event)">
                set max work load
            </button>
        </section>
        <article>
            <p th:if="${error}" th:text="${error}" style="border-left: 4px solid red;"></p>
        </article>
    </div>
</article>
    <hr />
<section>
<h2>Advised projects</h2>
<div class="project-grid">
    <th:block th:each="project : ${projects}">
        <article th:replace="~{fragments/project-card :: projectCard(project=${project})}"></article>
    </th:block>
</div>
</section>
    <dialog id="modal-example">
        <article>
            <header>
                <button
                        aria-label="Close"
                        rel="prev"
                        data-target="modal-example"
                        onclick="toggleModal(event)"
                ></button>
                <h3>Set max work load (amount of projects)</h3>
            </header>
            <form method="post" action="/advisor-dashboard/change-maxWorkLoad">
            <input type="number" name="number" placeholder="Number" aria-label="Number">
            <footer>
                <button type="submit" autofocus>Confirm
            </button>
            </footer>
            </form>
        </article>
    </dialog>
</main>
</body>
</html>
