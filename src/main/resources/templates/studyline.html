<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
<header th:replace="~{fragments/header ::header}"></header>

<main class="container">
    <nav>
        <ul>
            <li>
                <h1 th:text="${studyLineName}" style="margin-bottom: 0;">Study line</h1>
            </li>
        </ul>
        <ul>
            <li>
                <form th:action="@{/studyline/{id}/members(id=${studyLineId})}" method="get" style="margin-bottom: 0;">
                    <button type="submit" class="primary">Members</button>
                </form>
            </li>
            <li>
                <form th:action="@{/studyline/{id}/manage(id=${studyLineId})}" method="get" style="margin-bottom: 0;">
                    <button type="submit" class="primary">Manage</button>
                </form>
            </li>
        </ul>
    </nav>
    <section id="allProjects" th:if="${sectionVisibility.projectsVisible}">
        <h2>All projects</h2>
        <hr>
        <div class="project-grid">
            <th:block th:each="project : ${studyLineAllProjects}">
                <article th:replace="~{fragments/project-card :: projectCard(project=${project})}"></article>
            </th:block>
        </div>
    </section>

    <section>
        <h2>My projects</h2>
        <hr>
        <div class="project-grid">
            <th:block th:each="project : ${studyLineLoggedInUserProjects}">
                <article th:replace="~{fragments/project-card :: projectCard(project=${project})}"></article>
            </th:block>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer ::footer}"></footer>
</body>

</html>
