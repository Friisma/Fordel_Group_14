<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">
<head th:replace="~{fragments/head ::head}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container">
    <section>
        <h1>List of all projects</h1>
<table>
    <thead>
    <tr>
        <!--Each col in the tabel-->
        <th scope="col">name</th>
        <th scope="col">ID</th>
        <th scope="col">description</th>
        <th scope="col">study line</th>
    </tr>
    </thead>
    <tbody>
    <!--Each row in the tabel-->
    <tr th:each="project : ${projects}">
        <th th:text="${project.getProjectName()}">1</th>
        <td th:text="${project.getProjectIDAsString()}">Admin</td>
        <td th:text="${project.getDescription()}">Admin</td>
        <td>
            <form th:action="@{/advisor-projects-view/assignAdvisor}" method="post">
                <input type="hidden" name="project_name" th:value="${project.getProjectName()}"/>
                <input type="hidden" name="project_description" th:value="${project.getDescription()}"/>
                <input type="hidden" name="project_id" th:value="${project.getProjectID()}"/>
                <button type="submit">Advise</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
    </section>
</main>
</body>

</html>
