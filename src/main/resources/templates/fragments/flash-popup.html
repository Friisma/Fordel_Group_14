<th:block th:fragment="flashPopup">
    <div th:if="${message}" class="flash-popup success" role="status" aria-live="polite" data-autohide-ms="4000">
        <p th:text="${message}">Action completed.</p>
    </div>
    <div th:if="${error}" class="flash-popup error" role="alert" aria-live="assertive" data-autohide-ms="5000">
        <p th:text="${error}">Something went wrong.</p>
    </div>
</th:block>
