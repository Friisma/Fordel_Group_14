<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="passwordLastChanged(passwordChangedAt, passwordExpiresAt)">
    <div class="grid">
        <article class="password-card">
            <div class="password-card-header">
                <h2>Password last changed</h2>
            </div>
            <p class="password-card-description">When your password was last updated.</p>
            <p th:if="${passwordChangedAt != null}" th:text="${#temporals.format(passwordChangedAt, 'dd/MM/yyyy')}">
                18-06-2026 12:00
            </p>
            <p th:unless="${passwordChangedAt != null}">Not available yet</p>
        </article>

        <article class="password-card">
            <div class="password-card-header">
                <h2>Password expires</h2>
            </div>
            <p class="password-card-description">When your password should be changed again.</p>
            <p th:if="${passwordExpiresAt != null}" th:text="${#temporals.format(passwordExpiresAt, 'dd/MM/yyyy')}">
                18-09-2026 12:00
            </p>
            <p th:unless="${passwordExpiresAt != null}">Expires in 3 months after a password change.</p>
        </article>
    </div>
</th:block>
