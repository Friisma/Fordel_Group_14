<article th:fragment="projectCard(project)" th:id="${project.id}">
    <div class="project-header">
        <h2 th:text="${project.title}">Title</h2>

        <span class="badge role">
            #<span th:text="${project.id}">1</span>
        </span>
    </div>

    <p class="study-line">
        <span class="font-normal">Study line:</span>
        <span th:text="${project.studyLine}">Software Technology</span>
    </p>

    <p th:text="${project.description}">
        Description
    </p>
</article>
