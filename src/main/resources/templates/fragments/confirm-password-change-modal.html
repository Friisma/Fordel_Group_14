<dialog id="modal-confirm-password-change" th:fragment="confirmPasswordChangeModal">
    <article>
        <header>
            <button aria-label="Close" rel="prev" data-target="modal-confirm-password-change"
                onclick="toggleModal(event)"></button>
            <h3>Change password?</h3>
        </header>

        <p>
            Are you sure you want to change your password?
        </p>

        <div class="kick-modal-actions">
            <button type="button" class="secondary" data-target="modal-confirm-password-change"
                onclick="toggleModal(event)">Cancel</button>
            <button id="update-password-button" type="submit" class="kick-button" form="change-password-form">Yes,
                change</button>
        </div>
    </article>
</dialog>
