<article th:fragment="memberCard(member, projectId)" th:attr="data-user-name=${member.name},data-user-email=${member.email}">
    <div class="member-card-content">
        <div class="invitation-header">
            <a class="member-card-link" th:href="@{/user/{id}(id=${member.id})}">
                <h3 class="font-normal member-card-name" th:text="${member.name}">Member Name</h3>
            </a>
            <span class="badge role" th:text="${member.rolesDisplay}">Role</span>
        </div>

        <div class="member-card-actions">
            <a role="button" class="member-card-message" th:href="@{|mailto:${member.email}|}">Message User</a>
            <button th:if="${member.kickable}" type="button" class="kick-button" data-target="modal-confirm-kick"
                th:attr="data-member-email=${member.email},data-member-name=${member.name},data-project-id=${projectId}"
                onclick="openKickConfirm(event, this)">Kick</button>
        </div>
    </div>
</article>
