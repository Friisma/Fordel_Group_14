<dialog th:fragment="editProjectModal(project, projectId, title)" id="modal-edit-project">
  <article>
    <header>
      <button aria-label="Close" rel="prev" onclick="toggleModal(event)"></button>
      <p><strong>Edit Project</strong></p>
    </header>
    <form method="post" th:action="@{'/project/' + ${projectId} + '/updateProject'}">
      <label for="edit-project-title">Title
        <input type="text" id="edit-project-title" name="newTitle" th:value="${title}" required>
      </label>

      <label for="edit-project-description">Description
        <textarea id="edit-project-description" name="newDescription" th:text="${project.description}" required></textarea>
      </label>

      <footer>
        <button type="submit" class="primary">Save changes</button>
      </footer>
    </form>
  </article>
</dialog>
