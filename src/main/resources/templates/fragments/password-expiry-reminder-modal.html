<dialog id="modal-password-expiry-reminder" th:fragment="passwordExpiryReminderModal"
    th:attr="data-show=${showPasswordExpiryReminder}">
    <article>
        <header>
            <button aria-label="Close" rel="prev" data-target="modal-password-expiry-reminder"
                onclick="toggleModal(event)"></button>
            <h3>Password expires soon</h3>
        </header>

        <p>
            Your password expires in less than a week. You should change it soon.
        </p>

        <div class="kick-modal-actions">
            <button type="button" class="secondary" data-target="modal-password-expiry-reminder"
                onclick="toggleModal(event)">Ignore</button>
            <a href="/update-password" role="button" class="kick-button">Change password</a>
        </div>
    </article>
</dialog>
