<header>
  <nav class="container header-nav" aria-label="Primary">
    <a href="/" class="header-brand">Fordel</a>

    <ul class="header-links">
      <li><a href="/about" class="secondary">About</a></li>
      <li th:if="${userData != null && !userData.roles().isEmpty()}">
        <a href="/studylines" class="secondary">Study lines</a>
      </li>
      <li th:if="${rights != null && rights.hasPermission(T(dk.utd.fordel.services.rights.Permission).VIEW_USER)}">
        <a href="/users" class="secondary">Users</a>
      </li>
      <li th:if="${userData != null && userData.roles().contains(T(dk.utd.fordel.domain.Roles).STUDY_LEADER)}">
        <a href="/create-study-line" class="secondary">Create Study Line</a>
      </li>
      <li th:if="${userData != null && userData.roles().contains(T(dk.utd.fordel.domain.Roles).ADMINISTRATOR)}">
        <a href="/adminpage" class="secondary">Admin Page</a>
      </li>
      <li th:if="${userData != null && userData.roles().contains(T(dk.utd.fordel.domain.Roles).ADVISOR)}">
        <a href="/advisor-dashboard" class="secondary">Advisor dashboard</a>
      </li>
      <li th:if="${userData != null && userData.roles().contains(T(dk.utd.fordel.domain.Roles).ADVISOR)}">
        <a href="/advisor-projects-view" class="secondary">Potential advisor projects</a>
      </li>
    </ul>

    <div class="header-actions">
      <a th:if="${session.auth == null || session.auth.user == null}" href="/login" class="secondary header-icon-link"
        aria-label="Sign in">
        <svg width="1rem" height="1rem" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true" focusable="false">
          <path
            d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"
            fill="#969eaf"></path>
          <path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z" fill="#969eaf"></path>
        </svg>
      </a>

      <a th:if="${session.auth != null && session.auth.user != null}" href="#" data-target="modal-user-settings"
        class="secondary header-icon-link" onclick="toggleModal(event)" aria-label="Open user settings">
        <svg width="1rem" height="1rem" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true" focusable="false">
          <path
            d="M8 7C9.65685 7 11 5.65685 11 4C11 2.34315 9.65685 1 8 1C6.34315 1 5 2.34315 5 4C5 5.65685 6.34315 7 8 7Z"
            fill="#969eaf"></path>
          <path d="M14 12C14 10.3431 12.6569 9 11 9H5C3.34315 9 2 10.3431 2 12V15H14V12Z" fill="#969eaf"></path>
        </svg>
      </a>
    </div>

  </nav>

  <dialog id="modal-user-settings">
    <article>
      <header>
        <button aria-label="Close" rel="prev" data-target="modal-user-settings" onclick="toggleModal(event)"></button>
        <h3>User Settings</h3>
      </header>
      <section id="theme-switcher">
        <details open="">
          <summary>Theme</summary>
          <nav style="margin-top: -1rem; margin-bottom: -1rem;">
            <ul>
              <li>
                <details class="dropdown">
                  <summary role="button" class="secondary">Auto</summary>
                  <ul>
                    <li><a href="#" data-theme-switcher="auto">Auto</a></li>
                    <li><a href="#" data-theme-switcher="light">Light</a></li>
                    <li><a href="#" data-theme-switcher="dark">Dark</a></li>
                  </ul>
                </details>
              </li>
            </ul>
          </nav>
        </details>
      </section>
      <hr>
      <section id="change-username">
        <details open="">
          <summary>Change Username</summary>
          <form action="/user/update-username" method="post">
            <div style="display: flex; gap: 1rem;">
              <input type="text" name="name" placeholder="Username" aria-label="Username"
                th:value="${userData != null ? userData.name : ''}" required="">
              <button type="submit" style="width: auto;">
                Change
              </button>
            </div>
          </form>
        </details>
      </section>
      <hr>
      <section id="account-settings">
        <details open="">
          <summary>Account Settings</summary>
          <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <a href="/login" role="button" class="secondary" style="flex: 1; text-align: center; margin: 0;">
              Sign in To Another Account
            </a>
            <a href="/logout" role="button" class="secondary"
              style="flex: 1; text-align: center; margin: 0; background-color: #ff595e;">
              Sign Out
            </a>
          </div>
          <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
            <a href="/update-password" role="button" class="secondary" style="flex: 1; text-align: center; margin: 0;">
              Update Password
            </a>
          </div>
        </details>
      </section>
    </article>
  </dialog>

  <script th:src="@{/js/modal.js}" defer></script>
  <script th:src="@{/js/theme-switcher.js}" defer></script>
</header>
