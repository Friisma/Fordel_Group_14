<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
    <header th:replace="~{fragments/header ::header}"></header>

    <main class="container">
        <section style="text-align: center; padding: 2rem 0;">

            <img th:src="@{/images/expired.png}"
                 alt="Error"
                 style="max-width: 250px; width: 100%; margin-bottom: 1.5rem;" />

            <h1>Password Expired!</h1>

            <br>

            <p>
                Your password has expired! You may not use the site until you have changed it.
            </p>

            <br>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <a href="/logout" role="button" class="secondary" style="flex: 1; text-align: center; margin: 0; background-color: #ff595e;">
                    Sign Out
                </a>
                <a href="/login" role="button" class="secondary" style="flex: 1; text-align: center; margin: 0;">
                    Sign in To Another Account
                </a>
                <a href="/update-password" role="button" class="primary" style="flex: 1; text-align: center; margin: 0;">
                    Change password
                </a>
            </div>

        </section>
    </main>

    <footer th:replace="~{fragments/footer ::footer}"></footer>
</body>

</html>
