<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
    <header th:replace="~{fragments/header ::header}"></header>

    <main class="container">
        <section id="update-password">
            <h1>Update Password</h1>
            <form id="change-password-form" action="/change-password" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}" />
                <label th:replace="~{fragments/field :: field(${currentPassword})}"></label>
                <label th:replace="~{fragments/field :: field(${newPassword})}"></label>
                <label th:replace="~{fragments/field :: field(${confirmNewPassword})}"></label>
                <button id="open-update-password-modal" type="button" data-target="modal-confirm-password-change">Update
                    password</button>
            </form>
        </section>
    </main>

    <footer th:replace="~{fragments/footer ::footer}"></footer>
    <script th:src="@{/js/update-password.js}" defer></script>
</body>

</html>
