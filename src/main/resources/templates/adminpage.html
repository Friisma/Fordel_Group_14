<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
  <header th:replace="~{fragments/header :: header}"></header>
    <main class="container">
      <section>
        <h1>Alle Brugere i Systemet</h1>

        <table>
          <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Navn</th>
            <th scope="col">E-mail</th>
            <th scope="col">Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="user : ${users}">
            <th th:text="${user.id()}">1</th>
            <td th:text="${user.name()}">Admin</td>
            <td th:text="${user.email()}">admin@utd.dk</td>
            <td><nav>
              <ul>
                <li>
                  <details class="dropdown">
                    <summary role="button" class="secondary">Action</summary>
                    <ul>
                      <li><form action="/adminpage/grant-role" method="post" style="margin: 0; padding: 0;">
                        <input type="hidden" name="email" th:value="${user.email()}" />
                        <input type="hidden" name="role" value="STUDENT" />

                        <button type="submit">
                          Assign role
                        </button>
                      </form></li>
                      <li><a href="#">???????</a></li>
                      <li><a href="#">???????</a></li>
                    </ul>
                  </details>
                </li>
              </ul>
            </nav></td>
          </tr>
          </tbody>
        </table>
      </section>
    </main>
  <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>

</html>
