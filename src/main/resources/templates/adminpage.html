<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
  <header th:replace="~{fragments/header :: header}"></header>
    <main class="container">
      <section>
        <h1>List of all user</h1>

        <table>
          <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Name</th>
            <th scope="col">E-mail</th>
            <th scope="col">Role</th>
            <th scope="col">Study line</th>
            <th scope="col">Actions</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="user : ${users}">
            <th th:text="${user.id()}">1</th>
            <td th:text="${user.name()}">Admin</td>
            <td th:text="${user.email()}">admin@utd.dk</td>
            <td th:text="${#strings.listJoin(user.roles(), ', ')}">Role</td>
            <td th:text="${user.studyLine()}">Study line</td>
            <td><nav>
              <ul>
                <li>
                  <details class="dropdown">
                    <summary role="button" class="secondary">Action</summary>
                    <ul>

                      <li>
                        <button class="contrast"
                                data-target="modal-assign-role"
                                th:data-email="${user.email()}"
                                onclick="openRoleModal(event, this)">
                          Assign role
                        </button>
                      </li>

                      <li><a href="#">???????</a></li>
                    </ul>
                  </details>
                </li>
              </ul>
            </nav></td>
          </tr>
          </tbody>
        </table>
      </section>
    </main>
  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <dialog id="modal-assign-role">
    <article>
      <header>
        <button aria-label="Close" rel="prev" data-target="modal-assign-role" onclick="toggleModal(event)"></button>
        <h3>Assign role</h3>
      </header>

      <form action="/adminpage/grant-role" method="post">
        <input type="hidden" id="modal-email-input" name="email" value="" />

        <div style="display: flex; gap: 1rem; align-items: flex-end;">
          <div style="flex-grow: 1;">
            <label for="role-select">Assign user a role</label>
            <select id="role-select" name="role" required>
              <option value="" disabled selected>Select role</option>
              <option value="STUDENT">Student</option>
              <option value="ADVISOR">Advisor</option>
              <option value="TEACHER">Teacher</option>
              <option value="STUDY_LEADER">Study leader</option>
              <option value="ADMINISTRATOR">Administrator</option>
            </select>
          </div>

          <button type="submit" style="width: auto;">
            Assign role
          </button>
        </div>
      </form>
    </article>
  </dialog>

  <script th:src="@{/js/modal.js}" defer></script>
  <script>
    function openRoleModal(event, buttonElement) {
      const userEmail = buttonElement.getAttribute('data-email');

      document.getElementById('modal-email-input').value = userEmail;

      toggleModal(event);
    }
  </script>
</body>
</html>
