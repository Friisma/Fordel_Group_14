<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="da">

<head th:replace="~{fragments/head ::head}"></head>

<body>
  <header th:replace="~{fragments/header :: header}"></header>
    <main class="container">
      <section>
        <h1>List of all user</h1>

        <table>
          <thead>
          <tr>
            <!--Each col in the tabel-->
            <th scope="col">Id</th>
            <th scope="col">Name</th>
            <th scope="col">E-mail</th>
            <th scope="col">Role</th>
            <th scope="col">Study line</th>
            <th scope="col">Actions</th>
          </tr>
          </thead>
          <tbody>
          <!--Each row in the tabel-->
          <tr th:each="user : ${users}">
            <th th:text="${user.id()}">1</th>
            <td th:text="${user.name()}">Admin</td>
            <td th:text="${user.email()}">admin@utd.dk</td>
            <td th:text="${#strings.listJoin(user.roles(), ', ')}">Role</td>
            <td th:text="${user.studyLine()}">Study line</td>
            <td><nav>
              <ul>
                <li>
                  <details class="dropdown">
                    <summary role="button" class="secondary">Action</summary>
                    <ul>
                      <!--Assign role button-->
                      <li>
                        <button data-target="modal-assign-role"
                                th:data-email="${user.email()}"
                                onclick="openRoleModal(event, this)">
                          Assign role
                        </button>
                      </li>

                      <li>
                        <button data-target="modal-remove-role"
                                th:data-email="${user.email()}"
                                th:data-roles="${#strings.listJoin(user.roles(), ', ')}"
                                onclick="openRemoveRoleModal(event, this)">
                          Remove role
                        </button>
                      </li>
                    </ul>
                  </details>
                </li>
              </ul>
            </nav></td>
          </tr>
          </tbody>
        </table>
      </section>
    </main>
  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <!--Modal for assign role to a user-->
  <dialog id="modal-assign-role">
    <article>
      <header>
        <button aria-label="Close" rel="prev" data-target="modal-assign-role" onclick="toggleModal(event)"></button>
        <h3>Assign role</h3>
      </header>

      <form action="/adminpage/grant-role" method="post">
        <input type="hidden" id="assignRole-modal-email" name="email" value="" />

        <div style="display: flex; gap: 1rem; align-items: flex-end;">
          <div style="flex-grow: 1;">
            <label for="role-select">Assign user a role</label>
            <select id="role-select" name="role" required>
              <option value="" disabled selected>Select role</option>
              <option value="STUDENT">Student</option>
              <option value="ADVISOR">Advisor</option>
              <option value="TEACHER">Teacher</option>
              <option value="STUDY_LEADER">Study leader</option>
              <option value="ADMINISTRATOR">Administrator</option>
            </select>
          </div>

          <button type="submit" style="width: auto;">
            Assign role
          </button>
        </div>
      </form>
    </article>
  </dialog>

  <!--Modal for remove a role from a user-->
  <dialog id="modal-remove-role">
    <article>
      <header>
        <button aria-label="Close" rel="prev" data-target="modal-remove-role" onclick="toggleModal(event)"></button>
        <h3>Remove role</h3>
      </header>

      <form action="/adminpage/remove-role" method="post">
        <input type="hidden" id="removeRole-modal-email" name="email" value="" />
        <table>
          <thead>
          <tr>
            <!--Each col in the tabel-->
            <th scope="col">Role</th>
            <th scope="col">Action</th>
          </tr>
          </thead>

          <tbody id="remove-role-tbody"></tbody>

        </table>
      </form>
    </article>
  </dialog>

  <script th:src="@{/js/modal.js}" defer></script>
  <script>
    function openRoleModal(event, buttonElement) {
      const userEmail = buttonElement.getAttribute('data-email');

      document.getElementById('assignRole-modal-email').value = userEmail;

      toggleModal(event);
    }

    function openRemoveRoleModal(event, buttonElement) {
      const userEmail = buttonElement.getAttribute('data-email');
      const userRoles = buttonElement.getAttribute('data-roles');

      document.getElementById('removeRole-modal-email').value = userEmail;
      const tbody = document.getElementById('remove-role-tbody');
      tbody.innerHTML = '';

      if (userRoles && userRoles.trim() !== '') {
        const roles = userRoles.split(',');

        roles.forEach(role => {
          const cleanRole = role.trim();
          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td>${cleanRole}</td>
            <td>
              <button type="submit" name="role" value="${cleanRole}">
                Remove
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="2">No roles assigned.</td></tr>';
      }

      toggleModal(event);
    }
  </script>
</body>
</html>
